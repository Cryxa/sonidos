<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ladrido de perro</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eef7ff;
      text-align: center;
    }

    .tarjeta {
      background: white;
      margin: 20px;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 5px 20px #0002;
    }

    .perro { font-size: 100px; }

    button {
      padding: 15px 24px;
      border: 0;
      border-radius: 30px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <div class="perro">🐕</div>
    <h1>¡Guau!</h1>
    <p id="estado">Intentando reproducir el sonido...</p>

    <audio id="sonido" preload="auto">
      <source
        src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Perro_ladrar.ogg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
        type="audio/ogg">
    </audio>

    <button id="boton" hidden>🔊 Escuchar ladrido</button>
  </main>

  <script>
    const audio = document.getElementById("sonido");
    const estado = document.getElementById("estado");
    const boton = document.getElementById("boton");

    async function iniciar() {
      try {
        await audio.play();
        estado.textContent = "¡Escucha el ladrido del perro!";
      } catch (error) {
        estado.textContent =
          "Tu navegador bloqueó el sonido automático.";
        boton.hidden = false;
      }
    }

    boton.addEventListener("click", async () => {
      try {
        await audio.play();
        boton.hidden = true;
        estado.textContent = "¡Escucha el ladrido del perro!";
      } catch (error) {
        estado.textContent = "No se pudo reproducir el audio.";
      }
    });

    window.addEventListener("pageshow", iniciar);
  </script>
</body>
</html>
